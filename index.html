<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TurnApp — Gestioná los turnos de tu negocio</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#3F5044" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F5EFE4;
    --cream-deep: #EDE3D3;
    --ink: #262A20;
    --forest: #2F4033;
    --forest-soft: #3F5044;
    --gold: #B8862E;
    --gold-soft: #D9B876;
    --rose: #C48B93;
    --line: rgba(38,42,32,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', system-ui, sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  header{
    padding:28px 24px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    color:var(--forest);
    letter-spacing:-0.01em;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px 60px;
    gap:40px;
  }

  .hero{
    text-align:center;
    max-width:520px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(30px, 5vw, 44px);
    line-height:1.12;
    margin:0 0 14px;
    color:var(--forest);
  }
  .hero p{
    font-size:16px;
    line-height:1.55;
    color:rgba(38,42,32,0.72);
    margin:0;
  }

  /* --- signature: agenda viva --- */
  .schedule{
    width:280px;
    max-width:80vw;
    margin:28px auto 0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .slot{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    border-radius:10px;
    background:rgba(47,64,51,0.06);
    border:1px solid var(--line);
    font-size:13px;
    color:rgba(38,42,32,0.65);
  }
  .slot .time{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:13px;
    color:var(--forest);
    width:44px;
    flex-shrink:0;
  }
  .slot.busy{ background:rgba(47,64,51,0.11); }
  .slot.open{
    background:rgba(184,134,46,0.10);
    border-color:rgba(184,134,46,0.35);
    color:var(--gold);
    font-weight:500;
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(184,134,46,0.0); }
    50%{ box-shadow:0 0 0 6px rgba(184,134,46,0.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .slot.open{ animation:none; }
  }

  /* --- tarjeta de acceso --- */
  .card{
    width:100%;
    max-width:380px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 26px 26px;
    box-shadow:0 24px 48px -32px rgba(38,42,32,0.35);
  }
  .tabs{
    display:flex;
    gap:4px;
    background:var(--cream-deep);
    border-radius:999px;
    padding:4px;
    margin-bottom:22px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    color:rgba(38,42,32,0.55);
    cursor:pointer;
    border:none;
    background:transparent;
    font-family:inherit;
    transition:background .2s ease, color .2s ease;
  }
  .tab.active{
    background:var(--forest);
    color:var(--cream);
  }

  form{ display:none; flex-direction:column; gap:14px; }
  form.active{ display:flex; }

  label{
    font-size:12.5px;
    font-weight:600;
    color:rgba(38,42,32,0.6);
    margin-bottom:5px;
    display:block;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--cream);
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
  }
  .field input:focus{
    outline:2px solid var(--gold-soft);
    outline-offset:1px;
    border-color:var(--gold);
  }

  .submit{
    margin-top:6px;
    padding:12px 0;
    border:none;
    border-radius:9px;
    background:var(--forest);
    color:var(--cream);
    font-family:inherit;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:background .2s ease, transform .1s ease;
  }
  .submit:hover{ background:var(--forest-soft); }
  .submit:active{ transform:scale(0.98); }
  .submit:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .hint{
    font-size:12.5px;
    color:rgba(38,42,32,0.5);
    text-align:center;
    margin-top:4px;
  }

  .field{ position:relative; }
  .toggle-pass{
    position:absolute;
    right:10px;
    top:34px;
    background:none;
    border:none;
    font-size:12px;
    font-weight:600;
    color:rgba(38,42,32,0.5);
    cursor:pointer;
    font-family:inherit;
  }
  .toggle-pass:hover{ color:var(--forest); }

  .forgot{
    text-align:right;
    font-size:12px;
    color:var(--gold);
    background:none;
    border:none;
    font-family:inherit;
    cursor:pointer;
    padding:0;
    margin-top:-6px;
  }
  .forgot:hover{ text-decoration:underline; }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:16px 0 4px;
    color:rgba(38,42,32,0.4);
    font-size:12px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:11px 0;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fff;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    margin-top:12px;
  }
  .google-btn:hover{ background:var(--cream); }
  .google-btn svg{ width:17px; height:17px; }

  .msg{
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  .msg.show{ display:block; }
  .msg.error{ background:rgba(196,66,66,0.1); color:#9C3B3B; }
  .msg.ok{ background:rgba(63,80,68,0.1); color:var(--forest); }

  footer{
    text-align:center;
    padding:18px;
    font-size:12px;
    color:rgba(38,42,32,0.4);
  }
</style>
</head>
<body>

<header>
  <div class="brand">TurnApp</div>
</header>

<main>
  <div class="hero">
    <h1>La agenda se acomoda a vos,<br>no al revés.</h1>
    <p>Cada servicio, cada profesional, cada hueco entre turnos — vos decidís cómo se usa.</p>

    <div class="schedule" aria-hidden="true">
      <div class="slot busy"><span class="time">14:00</span> Corte — Melina</div>
      <div class="slot open"><span class="time">14:30</span> Hueco liberado — disponible</div>
      <div class="slot busy"><span class="time">15:00</span> Tintura — Rocío</div>
    </div>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" id="tab-login" role="tab" aria-selected="true">Iniciar sesión</button>
      <button class="tab" id="tab-register" role="tab" aria-selected="false">Crear cuenta</button>
    </div>

    <div class="msg" id="msg"></div>

    <form id="form-login" class="active" novalidate>
      <div class="field">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" data-target="login-pass">Ver</button>
      </div>
      <button type="button" class="forgot" id="btn-forgot">¿Olvidaste tu contraseña?</button>
      <button type="submit" class="submit">Entrar</button>

      <div class="divider">o</div>
      <button type="button" class="google-btn" id="btn-google-login">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2 14-5.4l-6.5-5.5C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5C9.6 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.5 5.5C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continuar con Google
      </button>
    </form>

    <form id="form-register" novalidate>
      <div class="field">
        <label for="reg-nombre">Nombre del negocio</label>
        <input type="text" id="reg-nombre" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="reg-email">Correo</label>
        <input type="email" id="reg-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" autocomplete="new-password" minlength="6" required>
        <button type="button" class="toggle-pass" data-target="reg-pass">Ver</button>
      </div>
      <div class="field">
        <label for="reg-pass2">Repetir contraseña</label>
        <input type="password" id="reg-pass2" autocomplete="new-password" minlength="6" required>
        <button type="button" class="toggle-pass" data-target="reg-pass2">Ver</button>
      </div>
      <button type="submit" class="submit">Crear mi cuenta</button>
      <p class="hint">Empezás con 6 meses gratis, sin tarjeta.</p>

      <div class="divider">o</div>
      <button type="button" class="google-btn" id="btn-google-register">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2 14-5.4l-6.5-5.5C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5C9.6 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.5 5.5C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Registrarme con Google
      </button>
    </form>
  </div>
</main>

<footer>TurnApp</footer>

<script type="module">
  import { firebaseConfig, DIAS_PLAN_GRATIS } from "./config.js";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // --- crear el documento del negocio si todavía no existe (registro o Google) ---
  async function asegurarNegocio(uid, nombreSugerido){
    const ref = doc(db, "businesses", uid);
    const snap = await getDoc(ref);
    if (snap.exists()) return;

    let nombreComercio = nombreSugerido;
    if (!nombreComercio){
      nombreComercio = prompt("¿Cómo se llama tu negocio?") || "Mi negocio";
    }
    const vencimiento = new Date();
    vencimiento.setDate(vencimiento.getDate() + DIAS_PLAN_GRATIS);

    await setDoc(ref, {
      nombreComercio,
      whatsapp: null,
      tema: "default",
      plan: "gratis",
      fechaVencimiento: vencimiento,
      creadoEl: serverTimestamp(),
    });
  }

  // --- mostrar/ocultar contraseña ---
  document.querySelectorAll(".toggle-pass").forEach((btn) => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.textContent = showing ? "Ver" : "Ocultar";
    });
  });

  // --- login con Google (ambos botones) ---
  async function loginConGoogle(){
    hideMsg();
    try {
      const cred = await signInWithPopup(auth, googleProvider);
      await asegurarNegocio(cred.user.uid, null);
      window.location.href = "./panel/index.html";
    } catch (err) {
      showMsg("No pudimos completar el ingreso con Google. Probá de nuevo.", "error");
    }
  }
  document.getElementById("btn-google-login").addEventListener("click", loginConGoogle);
  document.getElementById("btn-google-register").addEventListener("click", loginConGoogle);

  // --- recuperar contraseña ---
  document.getElementById("btn-forgot").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value.trim();
    if (!email){
      showMsg("Escribí tu correo arriba y volvé a tocar el enlace.", "error");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showMsg("Te mandamos un correo para reestablecer la contraseña.", "ok");
    } catch (err) {
      showMsg("No pudimos enviar el correo de recuperación. Revisá que el correo esté bien escrito.", "error");
    }
  });

  const tabLogin = document.getElementById("tab-login");
  const tabRegister = document.getElementById("tab-register");
  const formLogin = document.getElementById("form-login");
  const formRegister = document.getElementById("form-register");
  const msg = document.getElementById("msg");

  function showTab(which){
    const isLogin = which === "login";
    tabLogin.classList.toggle("active", isLogin);
    tabRegister.classList.toggle("active", !isLogin);
    tabLogin.setAttribute("aria-selected", isLogin);
    tabRegister.setAttribute("aria-selected", !isLogin);
    formLogin.classList.toggle("active", isLogin);
    formRegister.classList.toggle("active", !isLogin);
    hideMsg();
  }
  tabLogin.addEventListener("click", () => showTab("login"));
  tabRegister.addEventListener("click", () => showTab("register"));

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = "msg show " + type;
  }
  function hideMsg(){ msg.className = "msg"; }

  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg();
    const email = document.getElementById("login-email").value.trim();
    const pass = document.getElementById("login-pass").value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      window.location.href = "./panel/index.html";
    } catch (err) {
      showMsg("No pudimos iniciar sesión. Revisá el correo y la contraseña.", "error");
    }
  });

  formRegister.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg();
    const nombreComercio = document.getElementById("reg-nombre").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const pass = document.getElementById("reg-pass").value;
    const pass2 = document.getElementById("reg-pass2").value;

    if (pass !== pass2){
      showMsg("Las contraseñas no coinciden.", "error");
      return;
    }

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await asegurarNegocio(cred.user.uid, nombreComercio);
      window.location.href = "./panel/index.html";
    } catch (err) {
      showMsg("No pudimos crear la cuenta. Probá con otro correo o revisá la contraseña (mínimo 6 caracteres).", "error");
    }
  });
</script>

</body>
</html>
